name: Publish a verified submission

# Privileged half of submissions. Runs after the scan workflow finishes and
# treats its artifact as hostile input: the artifact is downloaded outside the
# workspace, validated strictly, and only a clean verified record can cause a
# branch, a commit, or a PR. Nothing here loads a stranger's URL.
#
# The issue number travels in the artifact (meta.json, written from trusted
# event context by the scan job). It is only a routing hint: the job fetches
# the issue back and proceeds only if it is open and labelled site-submission.

on:
  workflow_run:
    workflows: ["Scan a submitted site"]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: github.event.workflow_run.event == 'issues' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Fetch the scan result (untrusted)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scan-result
          path: /tmp/art
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide, splice, propose, comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        # The gh CLI needs an explicit token; without it `gh pr create` fails
        # with empty stdout, which once shipped a "PR is opening" comment with
        # no PR. Fail loudly instead (see the status checks below).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { execFileSync, spawnSync } = require("node:child_process");
            const fs = require("node:fs");
            const run = (cmd, args, opts = {}) =>
              spawnSync(cmd, args, { encoding: "utf8", ...opts });

            // 1. Routing hint only: which issue asked for this scan.
            let meta;
            try {
              meta = JSON.parse(fs.readFileSync("/tmp/art/meta.json", "utf8"));
            } catch {
              core.setFailed("no meta.json in the artifact");
              return;
            }
            if (!meta || !Number.isInteger(meta.issue) || meta.issue <= 0) {
              core.setFailed("bad meta.json");
              return;
            }

            // 2. Authoritative check: the issue must be an open submission.
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: meta.issue,
            });
            const labels = (issue.labels ?? []).map((l) => (typeof l === "string" ? l : l.name));
            if (issue.state !== "open" || !labels.includes("site-submission")) {
              core.setFailed(`issue #${meta.issue} is not an open submission`);
              return;
            }

            // 3. Validate the result and render the decision + comment.
            run("node", [
              "tools/submit/decide.mjs",
              "--result", "/tmp/art/result.json",
              "--issue", String(meta.issue),
              "--out", "/tmp/decision",
            ], { stdio: "inherit" });
            const decision = JSON.parse(fs.readFileSync("/tmp/decision.json", "utf8"));
            const comment = fs.readFileSync("/tmp/decision.md", "utf8");

            if (decision.action === "pr" && decision.entry) {
              // 4. Splice on a branch named from validated data only. Every
              // mutation is status-checked: a silent failure here once shipped
              // a "PR is opening" comment with no PR.
              const fail = async (reason) => {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: meta.issue,
                  labels: ["needs-review"],
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: meta.issue,
                  body: `Checked just now: **${decision.reason}** — but opening the listing PR failed (${reason}). A maintainer will propose it manually.`,
                });
                core.setFailed(`pr automation failed: ${reason}`);
              };
              const slug = decision.entry.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
              const branch = `submission/${slug}-${meta.issue}`;
              run("git", ["checkout", "-b", branch], { stdio: "inherit" });
              run("node", ["tools/submit/splice.mjs", "--record", "/tmp/art/result.json"], { stdio: "inherit" });
              run("git", ["add", "index/index.json", "seeds/launch.txt"], { stdio: "inherit" });
              const st = run("git", ["status", "--porcelain"]);
              if (!st.stdout.trim()) {
                await fail("splice produced no changes");
                return;
              }
              run("git", ["-c", "user.name=agent-webmcp-bot", "-c", "user.email=bot@orkestrate.space",
                "commit", "-m", `Add ${decision.entry} (submission #${meta.issue})`], { stdio: "inherit" });
              const push = run("git", ["push", "origin", branch], { stdio: "inherit" });
              if (push.status !== 0) {
                await fail(`git push exited ${push.status}`);
                return;
              }
              const pr = run("gh", ["pr", "create", "--title", `Add ${decision.entry} to the index`,
                "--body", `Closes #${meta.issue}.\n\nAutomated submission: verified by the scan job, proposed by the publish job. A maintainer merges to list it.\n\n${comment}`,
                "--head", branch, "--base", "main"]);
              if (pr.status !== 0) {
                await fail(`gh pr create exited ${pr.status}: ${(pr.stderr || "").slice(0, 200)}`);
                return;
              }
              core.info((pr.stdout || "").slice(0, 300));
            } else {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: meta.issue,
                labels: ["needs-review"],
              });
            }

            // 5. Comment either way. Content was rendered from validated data.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: meta.issue,
              body: comment,
            });
