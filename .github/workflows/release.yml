name: release
on:
  push:
    tags: ["v*"]
  # Dry run: prove the full 5-runner build + publish shape before any tag.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - install.sh
      - packages/**
      - Cargo.toml
      - src/**
  workflow_dispatch:

# npm provenance needs an OIDC identity; the publish token comes from secrets.
permissions:
  contents: read
  id-token: write

jobs:
  check-tag:
    # The tag check only applies to tag pushes; on PR / manual dry runs this
    # job is a no-op success (a skipped job would transitively skip `publish`,
    # which needs `build`, which needs this job).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$TAG" = "$CARGO" ] || { echo "tag v$TAG does not match Cargo.toml $CARGO"; exit 1; }

  build:
    needs: check-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are fully static musl binaries: no glibc floor at
          # all, so they run on any distro (glibc 2.17+, Alpine/musl, ...).
          # rusqlite (bundled) + ring both compile on musl; verified locally.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            pkg: linux-x64
            exe: agent-webmcp
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            pkg: linux-arm64
            exe: agent-webmcp
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: darwin-arm64
            exe: agent-webmcp
          - os: macos-15-intel
            target: x86_64-apple-darwin
            pkg: darwin-x64
            exe: agent-webmcp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: win32-x64
            exe: agent-webmcp.exe
    runs-on: ${{ matrix.os }}
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install musl toolchain (linux)
        if: runner.os == 'Linux'
        # musl-tools ships the native-arch musl-gcc (amd64 on x64 runners,
        # aarch64 on ARM runners) — apt is fast and reliable, unlike the
        # ~90MB musl.cc tarball, which times out from GitHub runners.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - run: node packages/make-platform-package.mjs ${{ matrix.pkg }} target/${{ matrix.target }}/release/${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.pkg }}
          path: packages/out/${{ matrix.pkg }}
      # Standalone archive for install.sh (Linux/macOS). tar keeps the exec
      # bit that upload-artifact would drop.
      - name: archive for install.sh
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-archive
          tar -czf dist-archive/agent-webmcp-${{ matrix.pkg }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.exe }}
      - name: archive for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-archive | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.exe }} -DestinationPath dist-archive/agent-webmcp-${{ matrix.pkg }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.pkg }}
          path: dist-archive/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: packages/out
          # NOTE: no merge-multiple. Each artifact uploads the *contents* of
          # packages/out/<pkg> (bin/ + package.json at the artifact root),
          # so merging would pile all five platforms into one franken-dir.
          # Unmerged, each lands in packages/out/npm-<pkg>/.
      # actions/upload-artifact does not preserve the exec bit; without this
      # the binary in the npm tarball is non-executable and the wrapper fails
      # with EACCES (the wrapper also chmod-repairs on EACCES as a backstop
      # for already-published tarballs).
      - run: chmod +x packages/out/npm-*/bin/*
      # Platform packages first (the wrapper depends on them), then the
      # wrapper. First release goes out under the `next` tag. After the
      # clean-machine test passes, move it:
      # `npm dist-tag add @orkestrate/agent-webmcp@<v> latest`.
      # Rollback is the same command pointing at the previous version.
      # New scoped packages default to restricted: --access public is required.
      - name: publish (real)
        if: github.ref_type == 'tag'
        run: |
          for d in packages/out/npm-*/; do (cd "$d" && npm publish --provenance --access public --tag next); done
          cp README.md packages/agent-webmcp/README.md
          npm publish --provenance --access public --tag next ./packages/agent-webmcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Standalone binaries + install.sh on the GitHub release. Created as a
  # draft: `releases/latest/download/install.sh` keeps serving the previous
  # release until a maintainer publishes the draft, the same promotion step
  # as moving npm's `latest`.
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist-archive
          merge-multiple: true
      - name: checksums
        run: |
          cp install.sh dist-archive/install.sh
          cd dist-archive && sha256sum agent-webmcp-* install.sh > SHA256SUMS && cat SHA256SUMS
      - name: draft release (tag only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-archive/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-archive/* --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          fi
      # Dry run needs no token and publishes nothing; proves the tarballs.
      - name: publish (dry run)
        if: github.ref_type != 'tag'
        run: |
          for d in packages/out/npm-*/; do (cd "$d" && npm publish --dry-run --access public --tag next); done
          cp README.md packages/agent-webmcp/README.md
          npm publish --dry-run --access public --tag next ./packages/agent-webmcp
