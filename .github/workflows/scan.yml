name: Scan a submitted site

# Unprivileged half of submissions. Triggered by a site-submission issue, this
# job loads strangers' URLs, so it holds no secrets and only read permission.
# It uploads one result file; the publish workflow treats that file as hostile
# input and validates it before doing anything with write permission.

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

jobs:
  scan:
    if: contains(github.event.issue.labels.*.name, 'site-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Parse and validate the request
        id: request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = context.payload.issue.body ?? "";
            // Issue-form fields render as "### Heading\n\nvalue" sections.
            const section = (name) => {
              const m = body.match(new RegExp(`### ${name}\r?\n\r?\n([\\s\\S]*?)(?=\r?\n### |\s*$)`, "i"));
              return (m?.[1] ?? "").trim();
            };
            const { validateSubmission } = await import(
              `${process.env.GITHUB_WORKSPACE}/tools/submit/validate.mjs`
            );
            const result = await validateSubmission({
              url: section("Site URL"),
              pages: section("Other pages with tools"),
            });
            if (!result.ok) {
              core.setFailed(`rejected: ${result.reason}`);
              return;
            }
            core.setOutput("entry", result.entry);
            core.setOutput("urls", JSON.stringify(result.urls));

      - name: Install agent-browser
        if: steps.request.outputs.entry != ''
        run: npm install --global agent-browser

      - name: Check the site
        if: steps.request.outputs.entry != ''
        # check-site prints the site record as JSON on stdout and a human
        # summary on stderr. Exit 2 means "checked, no tools" (still a valid
        # record); only a crash leaves stdout empty, which the publish job
        # rejects during validation.
        run: node tools/check-site.mjs "${{ steps.request.outputs.entry }}" --pages 4 > /tmp/result.json || true
        env:
          # Belt and suspenders: the runner must never reach the cloud metadata
          # service, even if a redirect points it there. Chrome still follows
          # redirects internally; the pre-scan DNS check in validate.mjs
          # rejects private, loopback and link-local targets first.
          NO_PROXY: "169.254.169.254,100.100.100.200"

      - name: Record which issue this answers
        # Trusted context (the event), not the scan output. The publish job
        # re-verifies this issue is an open submission before commenting.
        if: steps.request.outputs.entry != ''
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: printf '{"issue":%s}\n' "$ISSUE_NUMBER" > /tmp/meta.json

      - name: Upload the result
        if: steps.request.outputs.entry != '' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scan-result
          path: |
            /tmp/result.json
            /tmp/meta.json
          if-no-files-found: error
          retention-days: 7
