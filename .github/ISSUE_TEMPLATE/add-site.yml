name: Add a site
description: Ask for your site to be listed in the agent-webmcp index.
title: "Add site: "
labels: ["site-submission"]
body:
  - type: markdown
    attributes:
      value: |
        We load your pages in a real browser and list the WebMCP tools they
        register. If tools are found and the result is clean, the site is
        listed automatically. Read how listing works in CONTRIBUTING.md.
  - type: input
    id: url
    attributes:
      label: Site URL
      description: The https URL where your tools live (homepage, or a docs page).
      placeholder: https://example.com/
    validations:
      required: true
  - type: textarea
    id: pages
    attributes:
      label: Other pages with tools (optional)
      description: One https URL per line, up to 3. Homepage plus docs, search or pricing are checked by default.
      placeholder: |
        https://example.com/docs
        https://example.com/search
  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: Where to reach you if the check needs a human. Never published.
      placeholder: you@example.com
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: The pages above are public, and loading them in a test browser is fine.
          required: true
        - label: I understand tools that need a login or interaction to appear are not indexed yet.
          required: true
