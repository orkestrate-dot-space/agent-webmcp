[package]
name = "agent-webmcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rmcp = { version = "3.10.0", features = ["client", "elicitation", "schemars", "transport-child-process", "transport-io"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util"] }
